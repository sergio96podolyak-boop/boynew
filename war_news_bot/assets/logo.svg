<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#ff3b30"/><stop offset=".55" stop-color="#d1121b"/><stop offset="1" stop-color="#7a0610"/>
    </radialGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe3e1"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="60%" r="50%">
      <stop offset="0" stop-color="#fff6d6"/><stop offset=".6" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff9f0a"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3a0005" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- light rays -->
  <g stroke="#fff" stroke-width="34" stroke-linecap="round" opacity=".95">
    <line x1="512" y1="150" x2="512" y2="230"/>
    <line x1="300" y1="225" x2="345" y2="292"/>
    <line x1="724" y1="225" x2="679" y2="292"/>
    <line x1="175" y1="380" x2="250" y2="410"/>
    <line x1="849" y1="380" x2="774" y2="410"/>
  </g>
  <!-- siren -->
  <g filter="url(#shadow)">
    <path d="M332 700 L332 520 A180 180 0 0 1 692 520 L692 700 Z" fill="url(#dome)"/>
    <path d="M392 700 L392 530 A120 120 0 0 1 632 530 L632 700 Z" fill="url(#core)" filter="url(#glow)"/>
    <path d="M430 560 A85 85 0 0 1 512 470" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" opacity=".85"/>
    <rect x="262" y="700" width="500" height="92" rx="30" fill="#fff"/>
    <rect x="232" y="772" width="560" height="70" rx="26" fill="#2a0a0d"/>
  </g>
</svg>
