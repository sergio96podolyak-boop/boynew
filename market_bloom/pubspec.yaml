name: pomarket
description: "PoMarket — a mobile mini-market business simulator."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  http: ^1.2.0
  audioplayers: ^6.5.1
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/pomarket_splash_512.png
    - assets/assets/generated/phase_a/
    - assets/assets/generated/phase_b5/
    - assets/assets/assets/generated/phase_b5/
    - assets/generated/main_world_v3_clean/
    - assets/generated/main_world_modular/
    - assets/audio/
    - assets/audio/ambience/
    - assets/audio/music/
    - assets/audio/sfx/ui/
    - assets/audio/sfx/progression/
    - assets/audio/sfx/inventory/
    - assets/audio/sfx/checkout/
    - assets/audio/sfx/customers/
    - assets/audio/sfx/delivery/
    - assets/audio/sfx/bakery/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/pomarket_icon_1024.png
  min_sdk_android: 24
  remove_alpha_ios: true
  adaptive_icon_background: "#078456"
  adaptive_icon_foreground: assets/branding/pomarket_icon_1024.png
  web:
    generate: true
    image_path: assets/branding/pomarket_icon_1024.png
    background_color: "#078456"
    theme_color: "#315F4A"

flutter_native_splash:
  color: "#0C5A40"
  color_dark: "#0C5A40"
  image: assets/branding/pomarket_icon_1024.png
  image_dark: assets/branding/pomarket_icon_1024.png
  android: true
  ios: true
  web: false
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#0C5A40"
    color_dark: "#0C5A40"
    image: assets/branding/pomarket_icon_1024.png
    image_dark: assets/branding/pomarket_icon_1024.png
    icon_background_color: "#0C5A40"
    icon_background_color_dark: "#0C5A40"
