<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Build a tiny mini-market into a thriving business in PoMarket.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0C5A40">
  <meta property="og:type" content="website">
  <meta property="og:title" content="PoMarket — Build Your Store Empire">
  <meta property="og:description" content="Stock shelves, serve customers, unlock achievements, and challenge your friends.">
  <meta property="og:image" content="https://pomarket-review.ordersp495.chatgpt.site/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PoMarket — Build Your Store Empire">
  <meta name="twitter:description" content="Can you build the highest-scoring mini-market?">
  <meta name="twitter:image" content="https://pomarket-review.ordersp495.chatgpt.site/og.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PoMarket">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PoMarket</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: dark;
      --forest: #0c5a40;
      --forest-deep: #063d2c;
      --mint: #84e6b6;
      --cream: #f7e8c6;
      --gold: #ffc65a;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--forest-deep);
    }

    #pomarket-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      box-sizing: border-box;
      background:
        radial-gradient(circle at 50% 34%, rgb(132 230 182 / 32%), transparent 30%),
        radial-gradient(circle at 10% 8%, rgb(255 198 90 / 16%), transparent 26%),
        linear-gradient(160deg, var(--forest) 0%, var(--forest-deep) 72%);
      opacity: 1;
      transition: opacity 420ms ease;
      font-family: ui-rounded, "SF Pro Rounded", "SF Pro Display", system-ui, sans-serif;
    }

    #pomarket-loader::before,
    #pomarket-loader::after {
      position: absolute;
      width: 42vmax;
      height: 42vmax;
      border: 1px solid rgb(247 232 198 / 10%);
      border-radius: 50%;
      content: "";
      animation: loader-drift 8s ease-in-out infinite alternate;
    }

    #pomarket-loader::before {
      top: -27vmax;
      right: -19vmax;
    }

    #pomarket-loader::after {
      bottom: -30vmax;
      left: -17vmax;
      animation-delay: -3s;
    }

    .pomarket-loader__content {
      position: relative;
      display: flex;
      width: min(78vw, 330px);
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .pomarket-loader__logo-shell {
      display: grid;
      width: clamp(118px, 34vw, 172px);
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgb(247 232 198 / 24%);
      border-radius: 34%;
      background: linear-gradient(145deg, rgb(255 255 255 / 18%), rgb(255 255 255 / 6%));
      box-shadow:
        0 28px 65px rgb(1 35 24 / 42%),
        0 0 54px rgb(132 230 182 / 18%),
        inset 0 1px 0 rgb(255 255 255 / 26%);
      animation: loader-breathe 2.2s ease-in-out infinite;
      backdrop-filter: blur(14px);
    }

    .pomarket-loader__logo {
      display: block;
      width: 82%;
      height: 82%;
      border-radius: 28%;
      object-fit: cover;
    }

    .pomarket-loader__title {
      margin-top: 26px;
      color: var(--cream);
      font-size: clamp(34px, 10vw, 48px);
      font-weight: 900;
      letter-spacing: -1.8px;
      line-height: 1;
      text-shadow: 0 8px 28px rgb(1 35 24 / 38%);
    }

    .pomarket-loader__tagline {
      margin-top: 10px;
      color: rgb(247 232 198 / 72%);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .pomarket-loader__track {
      position: relative;
      width: 100%;
      height: 7px;
      margin-top: 42px;
      overflow: hidden;
      border: 1px solid rgb(247 232 198 / 12%);
      border-radius: 999px;
      background: rgb(1 35 24 / 42%);
      box-shadow: inset 0 1px 4px rgb(1 25 17 / 38%);
    }

    .pomarket-loader__fill {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--mint), var(--gold), var(--mint));
      background-size: 180% 100%;
      transform: translateX(-72%);
      animation:
        loader-progress 2.4s cubic-bezier(.22, .74, .2, 1) forwards,
        loader-shimmer 1.1s linear infinite;
      box-shadow: 0 0 18px rgb(132 230 182 / 56%);
    }

    .pomarket-loader__status {
      margin-top: 13px;
      color: rgb(247 232 198 / 58%);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
    }

    .pomarket-loader--ready {
      pointer-events: none;
      opacity: 0;
    }

    @keyframes loader-breathe {
      0%,
      100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.025); }
    }

    @keyframes loader-drift {
      to { transform: translate3d(3vmax, -2vmax, 0) scale(1.08); }
    }

    @keyframes loader-progress {
      to { transform: translateX(-8%); }
    }

    @keyframes loader-shimmer {
      to { background-position: 180% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #pomarket-loader::before,
      #pomarket-loader::after,
      .pomarket-loader__logo-shell,
      .pomarket-loader__fill {
        animation-duration: 1ms;
        animation-iteration-count: 1;
      }
    }
  </style>
</head>
<body>
  <div id="pomarket-loader" role="status" aria-live="polite" aria-label="PoMarket is loading">
    <div class="pomarket-loader__content">
      <div class="pomarket-loader__logo-shell">
        <img
          class="pomarket-loader__logo"
          src="icons/Icon-192.png"
          alt=""
          width="192"
          height="192"
        >
      </div>
      <div class="pomarket-loader__title">PoMarket</div>
      <div class="pomarket-loader__tagline">BUILD · STOCK · GROW</div>
      <div class="pomarket-loader__track" aria-hidden="true">
        <div class="pomarket-loader__fill"></div>
      </div>
      <div class="pomarket-loader__status">PREPARING YOUR MARKET</div>
    </div>
  </div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      const loader = document.getElementById("pomarket-loader");
      if (!loader) return;
      loader.classList.add("pomarket-loader--ready");
      window.setTimeout(function () {
        loader.remove();
      }, 450);
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
